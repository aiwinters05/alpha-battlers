                </td>
                <td class="tile opponent-tile">
                    <div class="letter"></div>
                    <div class="points"></div>
                </td>
            </tr>
        </table>
    </div>
    <div id="playerArea" class="player-area">
        <div class="rack-area">
            <div id="wordDisplay" class="word-display"></div>
            <table id="playerRack" class="rack">

        </div>
        <div id="playerHud" class="hud-area">
            <div id="playerUsername" class="username-display"></div>
            <div id="playerHp" class="hp-display"></div>
            <div id="playerButtons" class="player-buttons">
                <button id="playWord" class="player-button play-word">Play Word</button>
                <button id="returnAll" class="player-button return-all">Return Tiles To Rack</button>
                <button id="shuffle" class="player-button shuffle">Shuffle</button>
