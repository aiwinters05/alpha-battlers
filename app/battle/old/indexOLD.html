<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<style>
		.rack {
			display: flex;
			padding: 10px 20px 20px 20px;
			border-radius: 4px;
			gap: 6px;
			background-color: #a5a5a5;
		}
		.tile {
			width: 50px;
			height: 50px;
			border-radius: 6px;
			display: flex;
			justify-content: center;
			align-items: center;
			position: relative;
			font-size: 32px;
			font-weight: bold;
			user-select: none;
			cursor: pointer;
		}
		.tile.selected {
			transform: translateY(-5px);
			background-color: #7b7b7b;
		}
		.score {
			position: absolute;
			bottom: 4px;
			right: 6px;
			font-size: 10px;
			font-weight: bold;
		}
		.word-display {
			height: 40px;
			margin-bottom: 10px;
			text-align: center;
			font-size: 32px;
			font-weight: bold;
		}
	</style>
	<script type="module" src="battle.js"></script>	
</head>
<body>
</body>
</html>
