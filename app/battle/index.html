	<style>
		.rack {
			display: flex;
			padding: 10px 20px 20px 20px;
			border-radius: 4px;
			gap: 6px;
			background-color: #808080;
		}
		.tile {
			width: 50px;
			height: 50px;
			border-radius: 6px;

			position: relative;
			font-size: 32px;
			font-weight: bold;
			user-select: none;
		}
		.score {
			position: absolute;
			bottom: 4px;
			right: 6px;
			font-size: 11px;
			font-weight: bold;
		}
